name: grain_video
description: "grain_video"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8 # iOS 风格图标
  flutter_riverpod: ^3.3.2 # 状态管理
  go_router: ^17.0.0 # 路由
  # drift 钉 2.29.x：Dart 3.8 + riverpod 3.3.2（依赖 test→analyzer<8）下，
  # drift_dev 2.30+ 要求 analyzer>=8.1 无法解析；2.29 是最后一个 analyzer 7.x 线。
  drift: ">=2.29.0 <2.30.0" # 本地数据库（SQLite ORM）
  drift_flutter: 0.2.7 # drift 平台连接（含 sqlite3 原生库）
  dio: ^5.11.1 # HTTP 客户端
  cookie_jar: ^4.0.9 # Cookie 持久化（源站会话）
  media_kit: ^1.2.6 # 播放器内核（libmpv）
  media_kit_video: ^2.0.1 # 播放器 UI 组件
  media_kit_libs_windows_video: ^1.0.11 # libmpv Windows 原生库
  media_kit_libs_android_video: ^1.3.8 # libmpv Android 原生库
  window_manager: ^0.5.2 # 桌面端窗口控制
  flutter_i18n: ^0.37.1 # 国际化（assets/l10n）
  html: ^0.15.7 # HTML 解析（源站页面兜底解析）
  xpath_selector_html_parser: ^3.0.1 # XPath 选择器
  path_provider: ^2.1.5 # 应用目录（插件目录/数据库路径）
  cached_network_image: ^3.4.1 # 封面磁盘缓存（对象数 LRU，缓存清理联动）
  flutter_cache_manager: ^3.5.0 # 缓存内核（cached_network_image 依赖，显式声明）
  shared_preferences: ^2.3.5 # 轻量设置持久化（预加载开关等）
  package_info_plus: ^9.0.1 # 应用版本号读取（升级检查）
  open_filex: ^4.5.0 # 调系统安装器（APK 安装）

  # WASM 插件引擎（唯一插件线路），独立仓库维护。
  # 联调期用 path 依赖；grain_video 发布前 grain_engine 需先发 pub.dev。
  grain_engine:
    path: ../grain_engine
  crypto: ^3.0.8
  cryptography: ^2.9.0
  dio_smart_retry: ^7.0.1

# wasm_run 0.1.0+2 经 flutter_rust_bridge → puppeteer 依赖 petitparser ^5/^6，
# 与 flutter_i18n → toml 0.17 的 petitparser ^7 冲突。puppeteer 仅被 frb 的
# 构建工具链引用，运行时（io 平台）不执行其代码路径，升级 petitparser 无实际影响。
dependency_overrides:
  petitparser: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: 2.29.0 # drift 代码生成（版本须与 drift 运行库 2.29.x 配对）
  build_runner: 2.7.1 # 代码生成执行器（build 3.x 线，与 drift_dev 2.29 匹配）

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
